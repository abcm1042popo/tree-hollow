<style>
:root{
  --sky1:#0c1c3c; --sky2:#0c1c3c; --sky3:#14284d;
  --panel:#0f1b33; --panel2:#16264a; --line:#e8e3d3; --line2:#6d84b0;
  --text:#f1ecdc; --dim:#a9b4cc; --gold:#f3c45a; --gold2:#c98f2b;
  --sea:#4fb3c8; --red:#e0735a; --ok:#7ccf8a;
  --px:'Press Start 2P', monospace;
  --zh:'Noto Sans TC', system-ui, sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
html{background:var(--sky1)}
body{
  min-height:100vh; color:var(--text); font-family:var(--zh); line-height:1.7;
  background:linear-gradient(180deg,var(--sky1) 0%,var(--sky2) 55%,var(--sky3) 100%);
  overflow-x:hidden;
}
.stars{position:fixed;inset:0;pointer-events:none;z-index:0}
.star{position:absolute;width:2px;height:2px;background:#fff;animation:twinkle 3s infinite steps(2)}
@keyframes twinkle{50%{opacity:.25}}
.moon{display:none;position:fixed;top:28px;right:9%;width:44px;height:44px;background:#fff3c7;
  box-shadow:0 0 30px 8px rgba(255,236,170,.25);z-index:0;
  clip-path:polygon(25% 0,75% 0,100% 25%,100% 75%,75% 100%,25% 100%,0 75%,0 25%)}
main{position:relative;z-index:1;max-width:620px;margin:0 auto;padding:28px 16px 48px}
header{text-align:center;margin-bottom:6px}
.tag{font-family:var(--px);font-size:9px;color:var(--sea);letter-spacing:2px}
h1{margin:10px 0 4px;font-size:30px;letter-spacing:4px;color:var(--gold);
  text-shadow:3px 3px 0 #5a3a10}
.sub{color:var(--dim);font-size:14px;margin:0}

.hero{position:relative;margin:0 -8px}
.hero img{display:block;width:100%;height:auto;image-rendering:pixelated}
.flyer{position:absolute;width:9%;left:40%;top:70%;opacity:0;pointer-events:none;transform:translate(-50%,-50%)}
.flyer svg{width:100%;height:auto;display:block}
.flyer.go{transition:left .9s ease-in,top .9s cubic-bezier(.3,-0.6,.7,1),transform .9s ease-in,opacity .9s steps(1,end);left:66%!important;top:64%!important;transform:translate(-50%,-50%) scale(.25);opacity:0}
.scene{display:flex;justify-content:center;margin:10px 0 2px}
.scene svg{width:min(340px,86vw);height:auto;image-rendering:pixelated}
#bucket{transition:transform 1.3s steps(14)}
#bucket.down{transform:translateY(26px)}
.ff{animation:twinkle 2.4s infinite steps(2)}
#stone.fall{animation:fall .9s steps(10) forwards}
@keyframes fall{0%{opacity:1;transform:translateY(0)}100%{opacity:1;transform:translateY(34px)}}
#splash{opacity:0}
#splash.show{animation:splash .9s steps(4) forwards}
@keyframes splash{0%{opacity:1;transform:scaleX(.4)}100%{opacity:0;transform:scaleX(1.4)}}
#splash{transform-origin:48px 58px}

.box{background:var(--panel);border:4px solid var(--line);
  box-shadow:0 0 0 4px var(--panel),0 0 0 8px var(--line2),8px 12px 0 8px rgba(0,0,0,.35);
  padding:18px 18px 20px;margin:20px 8px 0;position:relative}
.menu{display:flex;gap:6px;margin-bottom:14px;border-bottom:2px dashed var(--line2);padding-bottom:10px}
.menu button{background:none;border:0;color:var(--dim);font:700 16px var(--zh);cursor:pointer;padding:4px 8px}
.menu button::before{content:'　';display:inline-block;width:1em;color:var(--gold)}
.menu button[aria-selected=true]{color:var(--text)}
.menu button[aria-selected=true]::before{content:'▶'}
.pane[hidden]{display:none}
label.f{display:block;font-size:14px;color:var(--dim);margin:10px 0 4px}
input[type=text],input[type=password],textarea{
  width:100%;background:#091226;color:var(--text);border:3px solid var(--line2);
  font:16px var(--zh);padding:10px 12px;outline:none;border-radius:0}
input:focus,textarea:focus{border-color:var(--gold)}
textarea{min-height:140px;resize:vertical}
.count{text-align:right;font-family:var(--px);font-size:8px;color:var(--dim);margin-top:4px}
.choice{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px}
.choice label{border:3px solid var(--line2);padding:10px;cursor:pointer;background:#0b1630;font-size:14px}
.choice label b{display:block;font-size:15px;color:var(--text)}
.choice label span{color:var(--dim);font-size:13px}
.choice input{position:absolute;opacity:0}
.choice label:has(input:checked){border-color:var(--gold);background:#1c2a4f}
.choice label:has(input:focus-visible){outline:2px solid var(--sea)}
.btn{display:block;width:100%;margin-top:16px;padding:12px;cursor:pointer;
  font:700 17px var(--zh);color:#2b1a05;background:var(--gold);border:0;
  box-shadow:inset -4px -4px 0 var(--gold2),0 4px 0 #5a3a10;letter-spacing:2px}
.btn:active{transform:translateY(3px);box-shadow:inset -4px -4px 0 var(--gold2)}
.btn:disabled{opacity:.5;cursor:wait}
.btn.ghost{background:var(--panel2);color:var(--text);box-shadow:inset -4px -4px 0 #0a1428,0 4px 0 #050a16}
.note{font-size:13px;color:var(--dim);margin:12px 0 0}
.msg{margin-top:14px;padding:12px;border:3px solid var(--line2);background:#0b1630;font-size:15px}
.msg.err{border-color:var(--red)}
.codebig{font-family:var(--px);font-size:22px;color:var(--gold);letter-spacing:4px;
  text-align:center;margin:12px 0;word-break:break-all}
.scroll{white-space:pre-wrap;word-break:break-word}
.reply{margin-top:12px;padding:12px;border-left:6px solid var(--sea);background:#0d2236}
.reply .who{font-size:13px;color:var(--sea);font-weight:700}
.meta{font-size:12px;color:var(--dim)}
footer{text-align:center;margin-top:28px;font-size:12px;color:var(--dim)}
footer button{background:none;border:0;color:var(--dim);font:12px var(--zh);cursor:pointer;text-decoration:underline dotted}
.demo{margin:14px 8px 0;padding:8px 12px;border:2px dashed var(--gold);color:var(--gold);font-size:13px;text-align:center}

/* 老師 */
#admin{position:fixed;inset:0;z-index:5;background:rgba(5,9,20,.92);overflow:auto;padding:24px 16px}
#admin[hidden]{display:none}
#admin .wrap{max-width:760px;margin:0 auto}
.ahead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.ahead h2{margin:0;color:var(--gold);font-size:20px;letter-spacing:2px}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.filters button,.small{background:var(--panel2);color:var(--text);border:2px solid var(--line2);
  padding:5px 10px;font:13px var(--zh);cursor:pointer}
.filters button[aria-pressed=true]{border-color:var(--gold);color:var(--gold)}
.card{background:var(--panel);border:3px solid var(--line2);padding:14px;margin-top:14px}
.card.hid{opacity:.45}
.card .top{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.badge{font-size:12px;padding:1px 6px;border:2px solid var(--line2);margin-left:6px}
.badge.new{border-color:var(--red);color:var(--red)}
.badge.rope{border-color:var(--sea);color:var(--sea)}
.card textarea{min-height:80px;margin-top:10px}
.row{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.row .small.primary{background:var(--gold);color:#2b1a05;border-color:var(--gold)}
@media (max-width:480px){.choice{grid-template-columns:1fr}h1{font-size:24px}}
</style>
</head>

        <label class="f" for="message">想說的話、問題、意見都可以</label>
        <textarea id="message" maxlength="2000" placeholder="例如：上週的莫耳濃度我還是不太懂……" required></textarea>
        <div class="count"><span id="cnt">0</span>/2000</div>

        <button class="btn" type="submit" id="dropBtn">丟進樹洞</button>
      </form>
      <div id="dropResult"></div>
      <p class="note">這個樹洞不會記錄你的帳號、Email 或位置；只有老師看得到內容，其他同學看不到。</p>
    </div>

    <!-- 拉水桶 -->
    <div class="pane" id="pane-pull" hidden>
      <form id="pullForm">
        <label class="f" for="code">輸入取回碼</label>
        <input type="text" id="code" maxlength="12" placeholder="例如 A7K2M9QX" autocomplete="off" style="font-family:var(--px);letter-spacing:3px;text-transform:uppercase">
        <button class="btn" type="submit" id="pullBtn">拉上來</button>
      </form>
      <div id="pullResult"></div>
    </div>
  </section>

  <footer>
    PYH LAB · 樹洞　<button type="button" id="openAdmin">老師入口</button>
  </footer>
</main>

<!-- 老師後台 -->
<div id="admin" hidden>
  <div class="wrap">
    <div class="ahead">
      <h2>🌳 老師入口</h2>
      <button class="small" type="button" id="closeAdmin">離開</button>
    </div>
    <div id="login">
      <section class="box">
        <form id="loginForm">
          <label class="f" for="pw">密碼</label>
          <input type="password" id="pw" autocomplete="current-password">
          <button class="btn" type="submit">進入</button>
        </form>
        <div id="loginMsg"></div>
      </section>
    </div>
    <div id="board" hidden>
      <div class="row" style="margin-top:14px;justify-content:space-between">
        <div class="filters" id="filters">
          <button type="button" data-f="todo" aria-pressed="true">待回覆水桶</button>
          <button type="button" data-f="stone" aria-pressed="false">石頭</button>
          <button type="button" data-f="all" aria-pressed="false">全部</button>
          <button type="button" data-f="hidden" aria-pressed="false">已隱藏</button>
        </div>
        <button class="small" type="button" id="refresh">重新整理</button>
      </div>
      <div id="stat" class="meta" style="margin-top:8px"></div>
      <div id="cards"></div>
    </div>
  </div>
</div>

<script>
const $ = s => document.querySelector(s);
const DEMO = !API_URL;
if (DEMO) $('#demoBanner').hidden = false;

/* ---------- 星星 ---------- */
(() => {
  const box = $('#stars');
  for (let i = 0; i < 70; i++) {
    const s = document.createElement('div');
    s.className = 'star';
    s.style.left = Math.random() * 100 + '%';
    s.style.top = Math.random() * 60 + '%';
    s.style.animationDelay = (Math.random() * 3).toFixed(2) + 's';
    if (Math.random() < .2) { s.style.width = s.style.height = '3px'; }
    box.appendChild(s);
  }
})();

/* ---------- 與樹洞溝通 ---------- */
async function api(action, payload) {
  if (DEMO) return demoApi(action, payload);
  const res = await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action, ...payload }) });
  return res.json();
}

function demoStore(v) {
  try {
    if (v) { localStorage.setItem('wellDemo', JSON.stringify(v)); return v; }
    return JSON.parse(localStorage.getItem('wellDemo') || '[]');
  } catch (e) { return window.__demo || (window.__demo = []); }
}
function stamp() {
  const d = new Date(), p = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}/${p(d.getMonth()+1)}/${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}
async function demoApi(action, p) {
  await new Promise(r => setTimeout(r, 300));
  const db = demoStore();
  const C = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789';
  if (action === 'drop') {
    if (!String(p.message || '').trim()) return { ok: false, error: '還沒寫東西喔，先寫點什麼吧' };
    const no = db.length + 1;
    const code = p.tether ? Array.from({ length: 8 }, () => C[Math.floor(Math.random() * C.length)]).join('') : '';
    db.push({ id: 'B' + String(no).padStart(4, '0'), code, createdAt: stamp(), name: p.name || '匿名',
      message: p.message, tether: !!p.tether, reply: '', repliedAt: '', hidden: false });
    demoStore(db); return { ok: true, no, code };
  }
  if (action === 'pull') {
    const r = db.find(x => x.code && x.code === String(p.code).toUpperCase());
    if (!r) return { ok: true, found: false };
    if (r.hidden) return { ok: true, found: true, removed: true };
    return { ok: true, found: true, no: db.indexOf(r) + 1, ...r };
  }
  if (p.password !== 'demo') return { ok: false, error: '密碼不對（示範模式密碼：demo）' };
  if (action === 'admin_list') return { ok: true, list: db.slice().reverse() };
  const r = db.find(x => x.id === p.id);
  if (!r) return { ok: false, error: '找不到這個水桶' };
  if (action === 'admin_reply') { r.reply = p.reply; r.repliedAt = p.reply ? stamp() : ''; }
  if (action === 'admin_hide') r.hidden = !!p.hidden;
  demoStore(db); return { ok: true };
}

/* ---------- 小工具 ---------- */
function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}
function showMsg(target, text, err) {
  target.replaceChildren(el('div', 'msg' + (err ? ' err' : ''), text));
}
const wait = ms => new Promise(r => setTimeout(r, ms));
const flyer = $('#flyer');
const BUCKET_SVG = '<svg viewBox="0 0 12 12" shape-rendering="crispEdges"><rect x="2" y="0" width="8" height="2" fill="#4a3320"/><rect x="1" y="2" width="10" height="10" fill="#9c6b3d"/><rect x="1" y="4" width="10" height="1" fill="#555"/><rect x="1" y="9" width="10" height="1" fill="#555"/><rect x="1" y="2" width="2" height="10" fill="#b9844f"/></svg>';
const STONE_SVG = '<svg viewBox="0 0 12 9" shape-rendering="crispEdges"><rect x="1" y="1" width="10" height="7" fill="#8d96a3"/><rect x="2" y="0" width="7" height="1" fill="#b4bcc7"/><rect x="1" y="1" width="10" height="1" fill="#b4bcc7"/><rect x="2" y="8" width="8" height="1" fill="#5d6673"/></svg>';
async function animateDrop(isStone) {
  const hero = document.querySelector('.hero');
  if (hero.getBoundingClientRect().bottom < 120) { hero.scrollIntoView({ behavior: 'smooth' }); await wait(500); }
  flyer.innerHTML = isStone ? STONE_SVG : BUCKET_SVG;
  flyer.classList.remove('go');
  flyer.style.left = isStone ? '30%' : '42%';
  flyer.style.top = isStone ? '76%' : '74%';
  flyer.style.opacity = '1';
  void flyer.offsetWidth;
  flyer.classList.add('go');
  await wait(950);
  flyer.style.opacity = '0'; flyer.classList.remove('go');
}
async function animatePull() { await wait(600); }

/* ---------- 分頁 ---------- */
document.querySelectorAll('[role=tab]').forEach(b => b.addEventListener('click', () => {
  document.querySelectorAll('[role=tab]').forEach(x => x.setAttribute('aria-selected', x === b));
  $('#pane-drop').hidden = b.dataset.tab !== 'drop';
  $('#pane-pull').hidden = b.dataset.tab !== 'pull';
}));

/* ---------- 丟水桶 ---------- */
$('#message').addEventListener('input', e => $('#cnt').textContent = e.target.value.length);
$('#dropForm').addEventListener('submit', async e => {
  e.preventDefault();
  const message = $('#message').value.trim();
  const out = $('#dropResult');
  if (!message) return showMsg(out, '還沒寫東西喔，先寫點什麼吧', true);
  const tether = document.querySelector('input[name=tether]:checked').value === '1';
  const btn = $('#dropBtn'); btn.disabled = true; btn.textContent = '水桶往下降……';
  try {
    const [r] = await Promise.all([api('drop', { name: $('#name').value.trim(), message, tether }), animateDrop(!tether)]);
    if (!r.ok) throw new Error(r.error);
    $('#message').value = ''; $('#cnt').textContent = '0';
    const box = el('div', 'msg');
    box.append(el('div', '', r.code ? `撲通！第 ${r.no} 號水桶已經沉進樹洞。` : `咚！第 ${r.no} 號石頭掉進樹洞了。說出來，有沒有舒服一點？`));
    if (r.code) {
      box.append(el('div', 'codebig', r.code));
      box.append(el('div', 'meta', '這是你的取回碼。請截圖或抄下來，遺失就拉不回來了（連老師也查不到是誰的）。'));
      const copy = el('button', 'btn ghost', '複製取回碼');
      copy.type = 'button';
      copy.onclick = async () => { try { await navigator.clipboard.writeText(r.code); copy.textContent = '已複製'; } catch (_) { copy.textContent = '請手動抄下'; } };
      box.append(copy);
    } else {
      box.append(el('div', 'meta', '石頭不會再拉上來，也不會有回覆。'));
    }
    out.replaceChildren(box);
  } catch (err) {
    showMsg(out, err.message || '樹洞好像暫時連不上，請稍後再試', true);
  } finally {
    btn.disabled = false; btn.textContent = '丟進樹洞';
  }
});

/* ---------- 拉水桶 ---------- */
$('#pullForm').addEventListener('submit', async e => {
  e.preventDefault();
  const code = $('#code').value.trim().toUpperCase();
  const out = $('#pullResult');
  if (!code) return showMsg(out, '請輸入取回碼', true);
  const btn = $('#pullBtn'); btn.disabled = true; btn.textContent = '拉繩子……';
  try {
    const [r] = await Promise.all([api('pull', { code }), animatePull()]);
    if (!r.ok) throw new Error(r.error);
    if (!r.found) return showMsg(out, '拉上來是空的……找不到這組取回碼，請確認有沒有打錯。', true);
    if (r.removed) return showMsg(out, '這個水桶已經被老師收起來了。');
    const box = el('div', 'msg');
    box.append(el('div', 'meta', `第 ${r.no} 號水桶 · ${r.createdAt} · ${r.name}`));
    box.append(el('div', 'scroll', r.message));
    if (r.reply) {
      const rep = el('div', 'reply');
      rep.append(el('div', 'who', `🌳 老師的回覆　${r.repliedAt}`));
      rep.append(el('div', 'scroll', r.reply));
      box.append(rep);
    } else {
      box.append(el('div', 'reply', '還沒有回覆，有時間再回，過幾天再來拉拉看。'));
    }
    out.replaceChildren(box);
  } catch (err) {
    showMsg(out, err.message || '樹洞好像暫時連不上，請稍後再試', true);
  } finally {
    btn.disabled = false; btn.textContent = '拉上來';
  }
});

/* ---------- 老師 ---------- */
let PW = '', LIST = [], FILTER = 'todo';
try { PW = sessionStorage.getItem('wellPw') || ''; } catch (_) {}
$('#openAdmin').onclick = () => { $('#admin').hidden = false; if (PW) loadList(); else $('#pw').focus(); };
$('#closeAdmin').onclick = () => { $('#admin').hidden = true; };
if (location.hash === '#keeper') $('#admin').hidden = false;

$('#loginForm').addEventListener('submit', async e => {
  e.preventDefault();
  PW = $('#pw').value;
  const ok = await loadList();
  if (ok) { try { sessionStorage.setItem('wellPw', PW); } catch (_) {} }
});
$('#refresh').onclick = loadList;
document.querySelectorAll('#filters button').forEach(b => b.onclick = () => {
  FILTER = b.dataset.f;
  document.querySelectorAll('#filters button').forEach(x => x.setAttribute('aria-pressed', x === b));
  render();
});

async function loadList() {
  try {
    const r = await api('admin_list', { password: PW });
    if (!r.ok) throw new Error(r.error);
    LIST = r.list; $('#login').hidden = true; $('#board').hidden = false; render(); return true;
  } catch (err) {
    PW = ''; try { sessionStorage.removeItem('wellPw'); } catch (_) {}
    $('#login').hidden = false; $('#board').hidden = true;
    showMsg($('#loginMsg'), err.message || '連不上樹洞', true); return false;
  }
}

function render() {
  const todo = LIST.filter(x => !x.hidden && x.tether && !x.reply).length;
  $('#stat').textContent = `共 ${LIST.length} 則 · 待回覆的水桶 ${todo} 個`;
  const shown = LIST.filter(x =>
    FILTER === 'all' ? true : FILTER === 'hidden' ? x.hidden : FILTER === 'stone' ? (!x.hidden && !x.tether) : (!x.hidden && x.tether && !x.reply));
  const wrap = $('#cards');
  if (!shown.length) return wrap.replaceChildren(el('div', 'msg', '這裡目前是空的。'));
  wrap.replaceChildren(...shown.map(card));
}

function card(x) {
  const c = el('div', 'card' + (x.hidden ? ' hid' : ''));
  const top = el('div', 'top');
  const left = el('div');
  left.append(el('b', '', x.id), el('span', 'meta', `　${x.createdAt} · ${x.name}`));
  left.append(el('span', 'badge' + (x.tether ? ' rope' : ''), x.tether ? '🪣 水桶' : '🪨 石頭'));
  if (x.tether && !x.reply && !x.hidden) left.append(el('span', 'badge new', '未回覆'));
  top.append(left);
  c.append(top, el('div', 'scroll', x.message));
  if (!x.tether) c.append(el('div', 'meta', '（石頭：學生不會看到回覆，這裡可寫自己的筆記）'));
  const ta = el('textarea'); ta.value = x.reply || ''; ta.placeholder = x.tether ? '寫下回覆……' : '筆記（學生看不到）';
  const msg = el('div', 'meta');
  const save = el('button', 'small primary', x.tether ? (x.reply ? '更新回覆' : '送出回覆') : '儲存筆記'); save.type = 'button';
  save.onclick = async () => {
    save.disabled = true; msg.textContent = '送出中……';
    const r = await api('admin_reply', { password: PW, id: x.id, reply: ta.value.trim() }).catch(() => ({ ok: false }));
    save.disabled = false;
    if (!r.ok) { msg.textContent = r.error || '送出失敗'; return; }
    x.reply = ta.value.trim(); x.repliedAt = stamp(); msg.textContent = '已送出 ✓'; save.textContent = '更新回覆';
  };
  const hide = el('button', 'small', x.hidden ? '取消隱藏' : '隱藏'); hide.type = 'button';
  hide.onclick = async () => {
    const r = await api('admin_hide', { password: PW, id: x.id, hidden: !x.hidden }).catch(() => ({ ok: false }));
    if (!r.ok) { msg.textContent = r.error || '操作失敗'; return; }
    x.hidden = !x.hidden; render();
  };
  const row = el('div', 'row'); row.append(save, hide);
  c.append(ta, row, msg);
  return c;
}
</script>
</body>
</html>
